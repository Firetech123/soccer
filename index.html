<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: #0b0f19;
      --msg-sent: #6366f1;
      --msg-received: #232d42;
      --online: #10b981;
      --offline: #64748b;
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body.dark-theme {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 620px;
      max-height: calc(100dvh - 40px);
      display: flex;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      height: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Prompt Card */
    .prompt-card {
      max-width: 400px;
      margin: auto;
      height: auto;
      padding: 32px;
    }

    .prompt-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      font-size: 44px;
      margin-bottom: 8px;
    }

    .prompt-header h2 {
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .prompt-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-group input {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .hidden {
      display: none !important;
    }

    /* Chat Card */
    .chat-card {
      height: 100%;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      text-transform: uppercase;
    }

    .status-indicator {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.online {
      background-color: var(--online);
      box-shadow: 0 0 8px var(--online);
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      position: relative;
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      display: flex;
      flex-direction: column;
    }

    .message-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .reply-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
      padding: 2px 4px;
      border-radius: 4px;
      transition: opacity 0.2s, background-color 0.2s;
    }

    .reply-btn:hover {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .reply-quote {
      background-color: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      padding: 6px 10px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .reply-quote-sender {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .reply-quote-text {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .reply-preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border-top: 1px solid var(--card-border);
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .reply-preview-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-right: 8px;
    }

    .reply-preview-title {
      font-weight: 600;
      color: var(--primary);
      font-size: 12px;
    }

    .reply-preview-snippet {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .cancel-reply-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .cancel-reply-btn:hover {
      color: var(--text-main);
    }

    .message-bubble.sent {
      align-self: flex-end;
      background-color: var(--msg-sent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      align-self: flex-start;
      background-color: var(--msg-received);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .message-sender {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-area input:focus {
      border-color: var(--primary);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .primary-btn {
      background-color: var(--primary);
      color: #fff;
    }

    .primary-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      body.dark-theme {
        padding: 0;
      }

      .app-container {
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
      }

      .card {
        border-radius: 0;
        border: none;
      }

      .prompt-card {
        width: 100%;
        max-width: 100%;
        padding: 24px 16px;
        box-shadow: none;
      }

      .chat-header {
        padding: 12px 16px;
      }

      .chat-messages {
        padding: 16px 12px;
      }

      .chat-input-area {
        padding: 12px 16px;
      }

      .message-bubble {
        max-width: 85%;
      }

      .reply-quote-text {
        max-width: 160px;
      }
    }
  </style>
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Name Prompt Screen -->
    <div id="join-screen" class="card prompt-card">
      <div class="prompt-header">
        <div class="logo-icon">💬</div>
        <h2>Welcome to Chat</h2>
        <p class="subtitle">Please enter your name to start chatting</p>
      </div>
      <form id="join-form" class="prompt-form" onsubmit="handleJoinChat(event)">
        <div class="input-group">
          <label for="username-input">Your Name</label>
          <input
            type="text"
            id="username-input"
            placeholder="Enter your name..."
            required
            autocomplete="off"
            maxlength="25"
          >
        </div>
        <button type="submit" class="btn primary-btn">Join Chat</button>
      </form>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="card chat-card hidden">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="user-info">
          <div class="avatar">💬</div>
          <div>
            <h3>Anonymous Chat</h3>
            <span class="status-indicator">
              <span class="status-dot online"></span> Connected
            </span>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="chat-messages" id="chat-messages">
        <!-- Messages appended dynamically -->
      </div>

      <!-- Reply Preview Bar -->
      <div id="reply-preview-bar" class="reply-preview-bar hidden">
        <div class="reply-preview-info">
          <span class="reply-preview-title" id="reply-preview-sender">Replying to ...</span>
          <span class="reply-preview-snippet" id="reply-preview-text">...</span>
        </div>
        <button type="button" class="cancel-reply-btn" onclick="cancelReply()" title="Cancel reply">&times;</button>
      </div>

      <!-- Chat Input Form -->
      <form id="chat-form" class="chat-input-area" onsubmit="handleSendMessage(event)">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
        >
        <button type="submit" class="btn primary-btn send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://dark-surf-6029.firetechsoftware.workers.dev/';
    let currentUsername = '';
    let localMessages = [];
    let activeReply = null;

    document.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('chat_username');
      if (savedName && savedName.trim()) {
        currentUsername = savedName.trim();
        document.getElementById('join-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
        initChat();
      } else {
        document.getElementById('username-input').focus();
      }
    });

    function handleJoinChat(e) {
      e.preventDefault();
      const input = document.getElementById('username-input');
      const name = input.value.trim();
      if (!name) return;

      currentUsername = name;
      localStorage.setItem('chat_username', name);

      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');

      initChat();
    }

    async function initChat() {
      await loadMessages();
      // Poll every 3 seconds for new messages
      setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
      try {
        const res = await fetch(`${WORKER_URL}?key=messages`);
        if (!res.ok) return;

        let messages = await res.json();
        if (typeof messages === 'string') {
          try { messages = JSON.parse(messages); } catch { messages = []; }
        }
        if (!Array.isArray(messages)) messages = [];

        localMessages = messages;
        renderMessages(messages);
      } catch (err) {
        console.error('Error loading messages from worker:', err);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-messages');
      const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;

      container.innerHTML = '';
      messages.forEach(appendMessage);

      if (isAtBottom) {
        scrollToBottom();
      }
    }

    function setReplyTarget(msg) {
      activeReply = {
        id: msg.id,
        sender: msg.sender || 'Anonymous',
        text: msg.text
      };

      const previewBar = document.getElementById('reply-preview-bar');
      const previewSender = document.getElementById('reply-preview-sender');
      const previewText = document.getElementById('reply-preview-text');

      previewSender.textContent = `Replying to ${activeReply.sender}`;
      previewText.textContent = activeReply.text;
      previewBar.classList.remove('hidden');

      const input = document.getElementById('message-input');
      input.focus();
    }

    function cancelReply() {
      activeReply = null;
      const previewBar = document.getElementById('reply-preview-bar');
      if (previewBar) {
        previewBar.classList.add('hidden');
      }
    }

    function appendMessage(msg) {
      const container = document.getElementById('chat-messages');
      const isSent = msg.sender === currentUsername;

      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isSent ? 'sent' : 'received'}`;
      bubble.dataset.id = msg.id;

      // Header row with sender & reply action
      const headerRow = document.createElement('div');
      headerRow.className = 'message-header-row';

      const senderDiv = document.createElement('div');
      senderDiv.className = 'message-sender';
      senderDiv.textContent = msg.sender || 'Anonymous';

      const replyBtn = document.createElement('button');
      replyBtn.type = 'button';
      replyBtn.className = 'reply-btn';
      replyBtn.textContent = 'Reply';
      replyBtn.onclick = () => setReplyTarget(msg);

      headerRow.appendChild(senderDiv);
      headerRow.appendChild(replyBtn);
      bubble.appendChild(headerRow);

      // If this message is a reply to another message
      if (msg.replyTo) {
        const quoteDiv = document.createElement('div');
        quoteDiv.className = 'reply-quote';

        const quoteSender = document.createElement('div');
        quoteSender.className = 'reply-quote-sender';
        quoteSender.textContent = msg.replyTo.sender || 'Anonymous';

        const quoteText = document.createElement('div');
        quoteText.className = 'reply-quote-text';
        quoteText.textContent = msg.replyTo.text || '';

        quoteDiv.appendChild(quoteSender);
        quoteDiv.appendChild(quoteText);
        bubble.appendChild(quoteDiv);
      }

      const textDiv = document.createElement('div');
      textDiv.textContent = msg.text;

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      timeDiv.textContent = timeStr;

      bubble.appendChild(textDiv);
      bubble.appendChild(timeDiv);

      container.appendChild(bubble);
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (!text) return;

      const newMessage = {
        id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
        sender: currentUsername,
        text: text,
        replyTo: activeReply || null,
        timestamp: new Date().toISOString()
      };

      input.value = '';
      cancelReply();

      // Optimistic update
      localMessages.push(newMessage);
      renderMessages(localMessages);
      scrollToBottom();

      try {
        await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            key: 'messages',
            value: JSON.stringify(localMessages)
          })
        });
      } catch (err) {
        console.error('Error saving message to worker:', err);
      }
    }
  </script>
</body>
</html>
