<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real-Time Chat</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --card-border: #e4e6eb;
      --primary: #0084ff;
      --primary-hover: #0073e6;
      --text-main: #050505;
      --text-muted: #65676b;
      --input-bg: #f0f2f5;
      --msg-sent: #0084ff;
      --msg-received: #e4e6eb;
      --msg-received-text: #050505;
      --online: #31a24c;
      --offline: #8a8d91;
      --error: #fa383e;
      --error-bg: rgba(250, 56, 62, 0.1);
      --wa-dark-bg: #0b141a;
      --wa-call-bg: #111b21;
      --wa-green: #25d366;
      --wa-green-hover: #20bd5a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .app-container {
      position: fixed;
      bottom: 0;
      right: 20px;
      z-index: 9999;
      width: 340px;
      height: 460px;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-bottom: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      width: 100%;
      height: 100%;
      box-shadow: 0 12px 28px 0 rgba(0, 0, 0, 0.2), 0 2px 4px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
      position: relative;
    }

    /* Prompt Card */
    .prompt-card {
      height: auto;
      max-height: 460px;
      padding: 24px 20px;
      margin-top: auto;
    }

    .prompt-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-icon {
      font-size: 38px;
      margin-bottom: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      max-width: 140px;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .avatar-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    .prompt-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .prompt-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-group input {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .hidden {
      display: none !important;
    }

    /* Chat Card */
    .chat-card {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      text-transform: uppercase;
    }

    .chat-header h3 {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .call-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 17px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
      color: var(--primary);
    }

    .icon-btn:hover {
      background-color: rgba(0, 132, 255, 0.1);
    }

    /* Minimized Floating Active Call Bar */
    .minimized-call-bar {
      background-color: #0084ff;
      color: #ffffff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 100;
      cursor: pointer;
    }

    .minimized-call-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .minimized-pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #25d366;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .minimized-call-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .minimized-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
    }

    .minimized-btn.end {
      background: var(--error);
    }

    /* WhatsApp Call Full Screen Overlay Modal */
    .call-overlay-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--wa-call-bg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .call-overlay-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .call-type-badge {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .call-minimize-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .call-minimize-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .call-user-details {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 10px;
      z-index: 10;
    }

    .call-avatar-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .call-avatar-img {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 2;
    }

    .call-pulse-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      border: 2px solid var(--wa-green);
      animation: pulseRing 1.8s infinite ease-out;
      opacity: 0;
      z-index: 1;
    }

    .call-pulse-ring:nth-child(2) {
      animation-delay: 0.6s;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .call-user-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .call-status-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 500;
    }

    /* Video Container inside Call Overlay */
    .call-video-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 1;
    }

    .call-remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .call-local-video-wrapper {
      position: absolute;
      top: 60px;
      right: 16px;
      width: 90px;
      height: 135px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
      z-index: 12;
      background: #111;
    }

    .call-local-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* In-Call Action Bar */
    .call-overlay-controls {
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    .call-action-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: background-color 0.2s, transform 0.1s;
    }

    .call-action-btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .call-action-btn:active {
      transform: scale(0.92);
    }

    .call-action-btn.off {
      background-color: #ffffff;
      color: #0d1418;
    }

    .call-action-btn.accept {
      background-color: var(--wa-green);
      color: #ffffff;
      width: 58px;
      height: 58px;
      font-size: 24px;
    }

    .call-action-btn.accept:hover {
      background-color: var(--wa-green-hover);
    }

    .call-action-btn.end {
      background-color: var(--error);
      color: #ffffff;
      width: 58px;
      height: 58px;
      font-size: 24px;
    }

    .call-action-btn.end:hover {
      background-color: #e0242a;
    }

    .status-indicator {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.online {
      background-color: var(--online);
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #ffffff;
    }

    .message-bubble {
      position: relative;
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
      display: flex;
      flex-direction: column;
    }

    /* System Call Event Bubbles */
    .system-call-bubble {
      align-self: center;
      background-color: #f0f2f5;
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 14px;
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--card-border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .system-call-bubble.missed {
      color: var(--error);
      background-color: var(--error-bg);
      border-color: rgba(250, 56, 62, 0.2);
    }

    .message-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .reply-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      opacity: 0.7;
      padding: 1px 3px;
      border-radius: 3px;
      transition: opacity 0.2s, background-color 0.2s;
    }

    .reply-btn:hover {
      opacity: 1;
      background-color: rgba(0, 0, 0, 0.05);
    }

    .reply-quote {
      background-color: rgba(0, 0, 0, 0.05);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      padding: 4px 8px;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .reply-quote-sender {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 1px;
    }

    .reply-quote-text {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .reply-preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #f0f2f5;
      border-top: 1px solid var(--card-border);
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .reply-preview-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-right: 8px;
    }

    .reply-preview-title {
      font-weight: 600;
      color: var(--primary);
      font-size: 11px;
    }

    .reply-preview-snippet {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .cancel-reply-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .cancel-reply-btn:hover {
      color: var(--text-main);
    }

    /* Edit Preview Bar */
    .edit-preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #eef7ff;
      border-top: 1px solid var(--card-border);
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .edit-preview-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-right: 8px;
    }

    .edit-preview-title {
      font-weight: 600;
      color: var(--primary);
      font-size: 11px;
    }

    .edit-preview-snippet {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .cancel-edit-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .cancel-edit-btn:hover {
      color: var(--text-main);
    }

    /* Image Preview Bar */
    .image-preview-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #f8f9fa;
      border-top: 1px solid var(--card-border);
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .image-preview-wrapper {
      position: relative;
      display: inline-block;
    }

    .image-preview-wrapper img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      display: block;
    }

    .remove-image-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-image-btn:hover {
      background: var(--error);
    }

    .image-preview-name {
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    /* Drag and Drop Overlay */
    .drag-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 132, 255, 0.85);
      color: #ffffff;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .chat-card.drag-active .drag-overlay {
      opacity: 1;
    }

    /* Image Attachment in Chat Messages */
    .chat-image-thumbnail {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 4px;
      margin-bottom: 4px;
      display: block;
      transition: opacity 0.2s;
    }

    .chat-image-thumbnail:hover {
      opacity: 0.9;
    }

    /* Image Modal / Full Preview */
    .image-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease-out;
    }

    .image-modal-content {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .image-modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .image-modal-close:hover {
      opacity: 1;
    }

    .image-attach-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
      transition: color 0.2s, background-color 0.2s;
    }

    .image-attach-btn:hover {
      color: var(--primary);
      background-color: rgba(0, 0, 0, 0.05);
    }

    .edited-tag {
      font-size: 10px;
      opacity: 0.7;
      font-style: italic;
      margin-left: 4px;
    }

    .deleted-bubble {
      font-style: italic;
      opacity: 0.6;
      user-select: none;
    }

    /* Context Menu / Action Modal */
    .message-menu-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.25);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.15s ease-out;
    }

    .message-menu-dialog {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 220px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .message-menu-item {
      background: none;
      border: none;
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.15s;
    }

    .message-menu-item:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .message-menu-item.danger {
      color: var(--error);
    }

    .message-menu-item.danger:hover {
      background-color: var(--error-bg);
    }

    /* Toast Notification */
    .toast-notification {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      z-index: 10001;
      pointer-events: none;
      animation: fadeIn 0.2s ease-out, fadeOut 0.3s ease-in 1.7s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translate(-50%, 0); }
      to { opacity: 0; transform: translate(-50%, -10px); }
    }

    .message-bubble.sent {
      align-self: flex-end;
      background-color: var(--msg-sent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      align-self: flex-start;
      background-color: var(--msg-received);
      color: var(--msg-received-text);
      border-bottom-left-radius: 4px;
    }

    .message-sender {
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 2px;
      opacity: 0.85;
    }

    .message-time {
      font-size: 9px;
      opacity: 0.75;
      margin-top: 2px;
      text-align: right;
    }

    .chat-input-area {
      padding: 10px 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
      background-color: #ffffff;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 8px 14px;
      color: var(--text-main);
      font-size: 13px;

      transition: border-color 0.2s;

    .chat-input-area input:focus {

    .btn {

      font-weight: 600;

      transition: background-color 0.2s;

    .primary-btn {
      background-color: var(--primary);
      color: #fff;
    }

    .primary-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Full-Screen Mobile Responsiveness */
    @media (max-width: 768px) {
      .app-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 9999;

      .card {
        border-radius: 0;

        box-shadow: none;
        height: 100%;
        width: 100%;

      .prompt-card {
        max-height: 100vh;
        max-height: 100dvh;
        margin-top: 0;
        justify-content: center;
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Name Prompt Screen -->
    <div id="join-screen" class="card prompt-card">
      <div class="prompt-header">
        <div class="logo-icon">
          <img src="logo.jpg" alt="Fire Tech Logo" class="logo-img">
        </div>
        <h2>Welcome to Chat</h2>
        <p class="subtitle">Please enter your name to start chatting</p>
      </div>
      <form id="join-form" class="prompt-form" onsubmit="handleJoinChat(event)">
        <div class="input-group">
          <label for="username-input">Your Name</label>
          <input
            type="text"
            id="username-input"
            placeholder="Enter your name..."
            required
            autocomplete="off"
            maxlength="25"
          >
        </div>
        <button type="submit" class="btn primary-btn">Join Chat</button>
      </form>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="card chat-card hidden">
      <!-- Drag Overlay -->
      <div class="drag-overlay" id="drag-overlay">
        <span style="font-size: 28px;">📷</span>
        <span>Drop image here to attach</span>
      </div>

      <!-- Chat Header -->
      <div class="chat-header">
        <div class="user-info">
          <img src="logo.jpg" alt="Logo" class="avatar-img">
          <div>
            <h3>Anonymous Chat</h3>
            <span class="status-indicator">
              <span class="status-dot online"></span> Connected • Messages deleted after 24h
            </span>
          </div>
        </div>
        <div class="call-header-actions">
          <button type="button" id="start-voice-call-btn" class="icon-btn" onclick="startCall('voice')" title="Start Voice Call">📞</button>
          <button type="button" id="start-video-call-btn" class="icon-btn" onclick="startCall('video')" title="Start Video Call">📹</button>
        </div>
      </div>

      <!-- Minimized Active Call Floating Bar -->
      <div id="minimized-call-bar" class="minimized-call-bar hidden" onclick="expandCallOverlay()">
        <div class="minimized-call-info">
          <div class="minimized-pulse-dot"></div>
          <span id="minimized-call-text">📞 Voice call • 00:00</span>
        </div>
        <div class="minimized-call-actions">
          <button type="button" class="minimized-btn" onclick="event.stopPropagation(); expandCallOverlay();">Expand</button>
          <button type="button" class="minimized-btn end" onclick="event.stopPropagation(); endCall('hangup');">End</button>
        </div>
      </div>

      <!-- WhatsApp Call Full Overlay Modal -->
      <div id="call-overlay-modal" class="call-overlay-modal hidden">
        <!-- Call Header / Top Controls -->
        <div class="call-overlay-header">
          <div class="call-type-badge">
            <span id="call-type-icon">📞</span>
            <span id="call-type-title">WhatsApp Voice Call</span>
          </div>
          <button type="button" class="call-minimize-btn" onclick="minimizeCallOverlay()" title="Minimize Call">🗕</button>
        </div>

        <!-- Video Background Grid (For Video Call Mode) -->
        <div id="call-video-grid" class="call-video-grid hidden">
          <video id="call-remote-video" class="call-remote-video" autoplay playsinline></video>
          <div id="call-local-video-wrapper" class="call-local-video-wrapper">
            <video id="call-local-video" class="call-local-video" autoplay playsinline muted></video>
          </div>
        </div>

        <!-- Call User Details (Avatar & Status) -->
        <div id="call-user-details" class="call-user-details">
          <div class="call-avatar-wrapper">
            <div id="call-pulse-ring-1" class="call-pulse-ring hidden"></div>
            <div id="call-pulse-ring-2" class="call-pulse-ring hidden"></div>
            <img src="logo.jpg" alt="Avatar" class="call-avatar-img">
          </div>
          <div id="call-peer-name" class="call-user-name">Anonymous Chat</div>
          <div id="call-status-text" class="call-status-text">Calling...</div>
        </div>

        <!-- In-Call Action Bar Controls -->
        <div class="call-overlay-controls">
          <!-- Outgoing / Active Call Controls -->
          <button type="button" id="call-toggle-audio-btn" class="call-action-btn" onclick="toggleAudio()" title="Mute/Unmute Audio">🎤</button>
          <button type="button" id="call-toggle-video-btn" class="call-action-btn" onclick="toggleVideo()" title="Camera On/Off">📹</button>

          <!-- Incoming Call Accept Button (Hidden by default) -->
          <button type="button" id="call-accept-btn" class="call-action-btn accept hidden" onclick="acceptCall()" title="Accept Call">📞</button>

          <!-- End / Decline Button -->
          <button type="button" id="call-end-btn" class="call-action-btn end" onclick="handleCallEndOrDecline()" title="End Call">🛑</button>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="chat-messages" id="chat-messages">
        <!-- Messages appended dynamically -->
      </div>

      <!-- Image Preview Bar -->
      <div id="image-preview-bar" class="image-preview-bar hidden">
        <div class="image-preview-wrapper">
          <img id="image-preview-img" src="" alt="Selected Attachment">
          <button type="button" class="remove-image-btn" onclick="removeAttachedImage()" title="Remove image">&times;</button>
        </div>
        <span id="image-preview-name" class="image-preview-name">image.png</span>
      </div>

      <!-- Reply Preview Bar -->
      <div id="reply-preview-bar" class="reply-preview-bar hidden">
        <div class="reply-preview-info">
          <span class="reply-preview-title" id="reply-preview-sender">Replying to ...</span>
          <span class="reply-preview-snippet" id="reply-preview-text">...</span>
        </div>
        <button type="button" class="cancel-reply-btn" onclick="cancelReply()" title="Cancel reply">&times;</button>
      </div>

      <!-- Edit Preview Bar -->
      <div id="edit-preview-bar" class="edit-preview-bar hidden">
        <div class="edit-preview-info">
          <span class="edit-preview-title">Editing Message</span>
          <span class="edit-preview-snippet" id="edit-preview-text">...</span>
        </div>
        <button type="button" class="cancel-edit-btn" onclick="cancelEdit()" title="Cancel edit">&times;</button>
      </div>

      <!-- Chat Input Form -->
      <form id="chat-form" class="chat-input-area" onsubmit="handleSendMessage(event)">
        <input type="file" id="image-file-input" accept="image/*" class="hidden" onchange="handleImageFileSelect(event)">
        <button type="button" class="image-attach-btn" onclick="document.getElementById('image-file-input').click()" title="Attach image">📷</button>
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
        >
        <button type="submit" class="btn primary-btn send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://dark-surf-6029.firetechsoftware.workers.dev/';
    const MAX_IMAGE_SIZE_BYTES = 5 * 1024 * 1024; // 5MB limit
    const RTC_CONFIG = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    let currentUsername = '';
    let localMessages = [];
    let activeReply = null;
    let activeEdit = null;
    let pressTimer = null;
    let activeMenu = null;
    let pendingImageBase64 = null;
    let pendingImageName = '';

    // WebRTC & Call State Variables
    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let currentCallId = null;
    let currentCallType = 'voice'; // 'voice' or 'video'
    let currentCallState = 'idle'; // 'idle', 'outgoing_calling', 'incoming_ringing', 'connected', 'ended'
    let pendingCallOffer = null;
    let isAudioMuted = false;
    let isVideoOff = false;
    let isCallMinimized = false;
    let callTimerInterval = null;
    let callDurationSeconds = 0;
    let processedSignalIds = new Set();
    let pendingIceCandidates = [];
    let signalQueue = Promise.resolve();

    document.addEventListener('DOMContentLoaded', () => {
      setupDragAndDropAndPaste();
      const savedName = localStorage.getItem('chat_username');
      if (savedName && savedName.trim()) {
        currentUsername = savedName.trim();
        document.getElementById('join-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
        initChat();
      } else {
        document.getElementById('username-input').focus();
      }
    });

    function setupDragAndDropAndPaste() {
      const chatCard = document.getElementById('chat-screen');

      // Drag and drop handlers
      ['dragenter', 'dragover'].forEach(eventName => {
        chatCard.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          chatCard.classList.add('drag-active');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        chatCard.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          chatCard.classList.remove('drag-active');
        }, false);
      });

      chatCard.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
          processImageFile(files[0]);
        }
      });

      // Clipboard paste listener
      window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData)?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            if (file) {
              processImageFile(file);
              break;
            }
          }
        }
      });
    }

    function processImageFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Please select a valid image file');
        return;
      }

      if (file.size > MAX_IMAGE_SIZE_BYTES) {
        showToast('Image size exceeds 5MB limit');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        pendingImageBase64 = e.target.result;
        pendingImageName = file.name || 'Pasted Image';
        showImagePreviewBar(pendingImageBase64, pendingImageName);
      };
      reader.onerror = function() {
        showToast('Failed to read image file');
      };
      reader.readAsDataURL(file);
    }

    function handleImageFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        processImageFile(file);
      }
      e.target.value = ''; // reset input
    }

    function showImagePreviewBar(base64Data, fileName) {
      const bar = document.getElementById('image-preview-bar');
      const img = document.getElementById('image-preview-img');
      const name = document.getElementById('image-preview-name');

      img.src = base64Data;
      name.textContent = fileName;
      bar.classList.remove('hidden');
    }

    function removeAttachedImage() {
      pendingImageBase64 = null;
      pendingImageName = '';
      const bar = document.getElementById('image-preview-bar');
      const img = document.getElementById('image-preview-img');
      img.src = '';
      bar.classList.add('hidden');
    }

    function handleJoinChat(e) {
      e.preventDefault();
      const input = document.getElementById('username-input');
      const name = input.value.trim();
      if (!name) return;

      currentUsername = name;
      localStorage.setItem('chat_username', name);

      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');

      initChat();
    }

    async function initChat() {
      await loadMessages();
      // Poll every 3 seconds for new messages
      setInterval(loadMessages, 3000);
      // Poll every 1.5 seconds for WebRTC signals
      setInterval(pollSignals, 1500);
    }

    /* ==========================================================================
       WhatsApp Voice & Video Call Implementation
       ========================================================================== */

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function startCallTimer() {
      stopCallTimer();
      callDurationSeconds = 0;
      callTimerInterval = setInterval(() => {
        callDurationSeconds++;
        const durationStr = formatDuration(callDurationSeconds);
        document.getElementById('call-status-text').textContent = durationStr;
        const icon = currentCallType === 'video' ? '📹' : '📞';
        const title = currentCallType === 'video' ? 'Video call' : 'Voice call';
        document.getElementById('minimized-call-text').textContent = `${icon} ${title} • ${durationStr}`;
      }, 1000);
    }

    function stopCallTimer() {
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }
    }

    function sendSignal(signalData) {
      signalQueue = signalQueue.then(async () => {
        try {
          const res = await fetch(`${WORKER_URL}?key=webrtc_signals`);
          let signals = [];
          if (res.ok) {
            signals = await res.json();
            if (typeof signals === 'string') {
              try { signals = JSON.parse(signals); } catch { signals = []; }
            }
          }
          if (!Array.isArray(signals)) signals = [];

          const now = Date.now();
          // Keep only signals from the last 2 minutes
          signals = signals.filter(s => s.timestamp && (now - s.timestamp < 120000));

          const signalObj = {
            id: now.toString() + Math.random().toString(36).substring(2, 6),
            timestamp: now,
            sender: currentUsername,
            ...signalData
          };

          signals.push(signalObj);

          await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              key: 'webrtc_signals',
              value: JSON.stringify(signals)
            })
          });
        } catch (err) {
          console.error('Error sending WebRTC signal:', err);
        }
      });
      return signalQueue;
    }

    async function pollSignals() {
      if (!currentUsername) return;

      try {
        const res = await fetch(`${WORKER_URL}?key=webrtc_signals`);
        if (!res.ok) return;

        let signals = await res.json();
        if (typeof signals === 'string') {
          try { signals = JSON.parse(signals); } catch { signals = []; }
        }
        if (!Array.isArray(signals)) return;

        for (const signal of signals) {
          if (!signal || !signal.id || processedSignalIds.has(signal.id)) continue;
          if (signal.sender === currentUsername) continue; // Ignore own signals

          processedSignalIds.add(signal.id);

          // Signal handlers
          if (signal.type === 'offer') {
            if (currentCallState === 'idle') {
              pendingCallOffer = signal;
              currentCallType = signal.callType || 'voice';
              currentCallId = signal.callId;
              showIncomingCallOverlay(signal);
            } else {
              // Respond with busy if already in call
              sendSignal({ type: 'decline', callId: signal.callId, reason: 'busy' });
            }
          } else if (signal.type === 'answer') {
            if (signal.callId === currentCallId && peerConnection) {
              if (peerConnection.signalingState === 'have-local-offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.answer));
                processPendingIceCandidates();
                onCallConnected();
              }
            }
          } else if (signal.type === 'candidate') {
            if (signal.callId === currentCallId) {
              const candidate = new RTCIceCandidate(signal.candidate);
              if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                await peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
              } else {
                pendingIceCandidates.push(candidate);
              }
            }
          } else if (signal.type === 'decline') {
            if (signal.callId === currentCallId) {
              const reasonText = signal.reason === 'busy' ? 'User is busy' : 'Call declined';
              showToast(reasonText);
              logCallHistorySystemMessage(reasonText, currentCallType, false);
              resetCallState();
            }
          } else if (signal.type === 'hangup') {
            if (signal.callId === currentCallId) {
              showToast('Call ended by peer');
              logCallHistorySystemMessage(callDurationSeconds > 0 ? `Call ended • ${formatDuration(callDurationSeconds)}` : 'Call ended', currentCallType, true);
              resetCallState();
            }
          }
        }
      } catch (err) {
        console.error('Error polling WebRTC signals:', err);
      }
    }

    async function processPendingIceCandidates() {
      if (peerConnection && peerConnection.remoteDescription && pendingIceCandidates.length > 0) {
        for (const candidate of pendingIceCandidates) {
          await peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
        }
        pendingIceCandidates = [];
      }
    }

    async function setupLocalMedia(type) {
      try {
        const constraints = {
          audio: true,
          video: type === 'video'
        };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);

        if (type === 'video') {
          const localVideoEl = document.getElementById('call-local-video');
          localVideoEl.srcObject = localStream;
        }
        return true;
      } catch (err) {
        console.error('Failed to get media devices:', err);
        showToast('Could not access camera/microphone');
        return false;
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(RTC_CONFIG);
      remoteStream = new MediaStream();

      const remoteVideoEl = document.getElementById('call-remote-video');
      remoteVideoEl.srcObject = remoteStream;

      if (localStream) {
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });
      }

      peerConnection.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => {
          remoteStream.addTrack(track);
        });
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && currentCallId) {
          sendSignal({
            type: 'candidate',
            callId: currentCallId,
            candidate: event.candidate
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'connected') {
          onCallConnected();
        } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          showToast('Call disconnected');
          resetCallState();
        }
      };
    }

    async function startCall(type = 'voice') {
      if (currentCallState !== 'idle') {
        showToast('Already in a call');
        return;
      }

      currentCallType = type;
      currentCallState = 'outgoing_calling';
      currentCallId = 'call_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

      updateCallOverlayUI();
      document.getElementById('call-overlay-modal').classList.remove('hidden');

      const mediaOk = await setupLocalMedia(type);
      if (!mediaOk) {
        resetCallState();
        return;
      }

      createPeerConnection();

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      await sendSignal({
        type: 'offer',
        callId: currentCallId,
        callType: type,
        offer: offer
      });
    }

    function showIncomingCallOverlay(signal) {
      currentCallState = 'incoming_ringing';
      updateCallOverlayUI();
      document.getElementById('call-peer-name').textContent = signal.sender || 'Someone';
      document.getElementById('call-overlay-modal').classList.remove('hidden');
    }

    async function acceptCall() {
      if (!pendingCallOffer) return;

      const offerSignal = pendingCallOffer;
      pendingCallOffer = null;

      currentCallState = 'connecting';
      currentCallType = offerSignal.callType || 'voice';
      currentCallId = offerSignal.callId;

      updateCallOverlayUI();

      const mediaOk = await setupLocalMedia(currentCallType);
      if (!mediaOk) {
        sendSignal({
          type: 'decline',
          callId: currentCallId
        });
        resetCallState();
        return;
      }

      createPeerConnection();

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offerSignal.offer));
      processPendingIceCandidates();

      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await sendSignal({
        type: 'answer',
        callId: currentCallId,
        answer: answer
      });

      onCallConnected();
    }

    function handleCallEndOrDecline() {
      if (currentCallState === 'incoming_ringing') {
        declineCall();
      } else {
        endCall('hangup');
      }
    }

    function declineCall() {
      if (pendingCallOffer) {
        sendSignal({
          type: 'decline',
          callId: pendingCallOffer.callId
        });
        logCallHistorySystemMessage(`Missed ${currentCallType} call`, currentCallType, false, true);
        pendingCallOffer = null;
      }
      resetCallState();
    }

    function endCall(type = 'hangup') {
      if (currentCallId) {
        sendSignal({
          type: 'hangup',
          callId: currentCallId
        });
        if (currentCallState === 'connected') {
          logCallHistorySystemMessage(`${currentCallType === 'video' ? 'Video' : 'Voice'} call • ${formatDuration(callDurationSeconds)}`, currentCallType, true);
        } else {
          logCallHistorySystemMessage(`Cancelled ${currentCallType} call`, currentCallType, true);
        }
      }
      resetCallState();
    }

    function onCallConnected() {
      if (currentCallState === 'connected') return;
      currentCallState = 'connected';
      updateCallOverlayUI();
      startCallTimer();
      showToast('Call connected');
    }

    function updateCallOverlayUI() {
      const modal = document.getElementById('call-overlay-modal');
      const callTypeIcon = document.getElementById('call-type-icon');
      const callTypeTitle = document.getElementById('call-type-title');
      const statusText = document.getElementById('call-status-text');
      const videoGrid = document.getElementById('call-video-grid');
      const acceptBtn = document.getElementById('call-accept-btn');
      const endBtn = document.getElementById('call-end-btn');
      const pulse1 = document.getElementById('call-pulse-ring-1');
      const pulse2 = document.getElementById('call-pulse-ring-2');
      const userDetails = document.getElementById('call-user-details');

      const isVideo = currentCallType === 'video';
      callTypeIcon.textContent = isVideo ? '📹' : '📞';
      callTypeTitle.textContent = isVideo ? 'WhatsApp Video Call' : 'WhatsApp Voice Call';

      if (isVideo && currentCallState === 'connected') {
        videoGrid.classList.remove('hidden');
        userDetails.style.zIndex = '5';
      } else {
        videoGrid.classList.add('hidden');
        userDetails.style.zIndex = '10';
      }

      if (currentCallState === 'outgoing_calling') {
        statusText.textContent = 'Calling...';
        pulse1.classList.remove('hidden');
        pulse2.classList.remove('hidden');
        acceptBtn.classList.add('hidden');
        endBtn.classList.remove('hidden');
      } else if (currentCallState === 'incoming_ringing') {
        statusText.textContent = `Incoming ${isVideo ? 'video' : 'voice'} call...`;
        pulse1.classList.remove('hidden');
        pulse2.classList.remove('hidden');
        acceptBtn.classList.remove('hidden');
        endBtn.classList.remove('hidden');
      } else if (currentCallState === 'connecting') {
        statusText.textContent = 'Connecting...';
        pulse1.classList.add('hidden');
        pulse2.classList.add('hidden');
        acceptBtn.classList.add('hidden');
        endBtn.classList.remove('hidden');
      } else if (currentCallState === 'connected') {
        statusText.textContent = formatDuration(callDurationSeconds);
        pulse1.classList.add('hidden');
        pulse2.classList.add('hidden');
        acceptBtn.classList.add('hidden');
        endBtn.classList.remove('hidden');
      }
    }

    function minimizeCallOverlay() {
      isCallMinimized = true;
      document.getElementById('call-overlay-modal').classList.add('hidden');
      document.getElementById('minimized-call-bar').classList.remove('hidden');
    }

    function expandCallOverlay() {
      isCallMinimized = false;
      document.getElementById('minimized-call-bar').classList.add('hidden');
      document.getElementById('call-overlay-modal').classList.remove('hidden');
    }

    function toggleAudio() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        isAudioMuted = !isAudioMuted;
        audioTrack.enabled = !isAudioMuted;
        const btn = document.getElementById('call-toggle-audio-btn');
        if (isAudioMuted) {
          btn.classList.add('off');
          btn.textContent = '🔇';
        } else {
          btn.classList.remove('off');
          btn.textContent = '🎤';
        }
      }
    }

    function toggleVideo() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        isVideoOff = !isVideoOff;
        videoTrack.enabled = !isVideoOff;
        const btn = document.getElementById('call-toggle-video-btn');
        if (isVideoOff) {
          btn.classList.add('off');
          btn.textContent = '📷';
        } else {
          btn.classList.remove('off');
          btn.textContent = '📹';
        }
      }
    }

    function resetCallState() {
      stopCallTimer();

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      if (remoteStream) {
        remoteStream.getTracks().forEach(track => track.stop());
        remoteStream = null;
      }

      currentCallId = null;
      currentCallState = 'idle';
      pendingCallOffer = null;
      isAudioMuted = false;
      isVideoOff = false;
      isCallMinimized = false;
      callDurationSeconds = 0;
      pendingIceCandidates = [];

      const localVideoEl = document.getElementById('call-local-video');
      const remoteVideoEl = document.getElementById('call-remote-video');
      if (localVideoEl) localVideoEl.srcObject = null;
      if (remoteVideoEl) remoteVideoEl.srcObject = null;

      document.getElementById('call-overlay-modal').classList.add('hidden');
      document.getElementById('minimized-call-bar').classList.add('hidden');

      const audioBtn = document.getElementById('call-toggle-audio-btn');
      const videoBtn = document.getElementById('call-toggle-video-btn');
      if (audioBtn) { audioBtn.classList.remove('off'); audioBtn.textContent = '🎤'; }
      if (videoBtn) { videoBtn.classList.remove('off'); videoBtn.textContent = '📹'; }
    }

    function logCallHistorySystemMessage(text, type = 'voice', isSent = true, isMissed = false) {
      const icon = type === 'video' ? '📹' : '📞';
      const systemMessage = {
        id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
        isSystem: true,
        text: `${icon} ${text}`,
        isMissed: isMissed,
        timestamp: new Date().toISOString()
      };

      localMessages.push(systemMessage);
      renderMessages(localMessages);
      saveLocalMessagesToWorker();
    }

    const RETENTION_MS = 24 * 60 * 60 * 1000;

    function filterExpiredMessagesClient(messages) {
      if (!Array.isArray(messages)) return [];
      const now = Date.now();
      return messages.filter(item => {
        if (!item) return false;
        let time = item.timestamp ? new Date(item.timestamp).getTime() : null;
        if (!time && item.id && !isNaN(Number(item.id.slice(0, 13)))) {
          time = Number(item.id.slice(0, 13));
        }
        if (!time) return true;
        return now - time < RETENTION_MS;
      });
    }

    async function loadMessages() {
      try {
        const res = await fetch(`${WORKER_URL}?key=messages`);
        if (!res.ok) return;

        let messages = await res.json();
        if (typeof messages === 'string') {
          try { messages = JSON.parse(messages); } catch { messages = []; }
        }
        if (!Array.isArray(messages)) messages = [];

        localMessages = filterExpiredMessagesClient(messages);
        renderMessages(localMessages);
      } catch (err) {
        console.error('Error loading messages from worker:', err);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-messages');
      const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;

      container.innerHTML = '';
      messages.forEach(appendMessage);

      if (isAtBottom) {
        scrollToBottom();
      }
    }

    function setReplyTarget(msg) {
      cancelEdit();
      activeReply = {
        id: msg.id,
        sender: msg.sender || 'Anonymous',
        text: msg.text
      };

      const previewBar = document.getElementById('reply-preview-bar');
      const previewSender = document.getElementById('reply-preview-sender');
      const previewText = document.getElementById('reply-preview-text');

      previewSender.textContent = `Replying to ${activeReply.sender}`;
      previewText.textContent = activeReply.text;
      previewBar.classList.remove('hidden');

      const input = document.getElementById('message-input');
      input.focus();
    }

    function cancelReply() {
      activeReply = null;
      const previewBar = document.getElementById('reply-preview-bar');
      if (previewBar) {
        previewBar.classList.add('hidden');
      }
    }

    function setEditTarget(msg) {
      cancelReply();
      activeEdit = msg;

      const previewBar = document.getElementById('edit-preview-bar');
      const previewText = document.getElementById('edit-preview-text');

      previewText.textContent = msg.text;
      previewBar.classList.remove('hidden');

      const input = document.getElementById('message-input');
      input.value = msg.text;
      input.focus();
    }

    function cancelEdit() {
      activeEdit = null;
      const previewBar = document.getElementById('edit-preview-bar');
      if (previewBar) {
        previewBar.classList.add('hidden');
      }
    }

    function showToast(message) {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 2000);
    }

    function closeContextMenu() {
      if (activeMenu) {
        activeMenu.remove();
        activeMenu = null;
      }
    }

    function openImageModal(src) {
      const backdrop = document.createElement('div');
      backdrop.className = 'image-modal-backdrop';
      backdrop.onclick = (e) => {
        if (e.target === backdrop || e.target.classList.contains('image-modal-close')) {
          backdrop.remove();
        }
      };

      const closeBtn = document.createElement('span');
      closeBtn.className = 'image-modal-close';
      closeBtn.innerHTML = '&times;';

      const img = document.createElement('img');
      img.className = 'image-modal-content';
      img.src = src;
      img.alt = 'Full size preview';

      backdrop.appendChild(closeBtn);
      backdrop.appendChild(img);
      document.body.appendChild(backdrop);
    }

    function openContextMenu(event, msg) {
      event.preventDefault();
      closeContextMenu();

      const backdrop = document.createElement('div');
      backdrop.className = 'message-menu-backdrop';
      backdrop.onclick = (e) => {
        if (e.target === backdrop) closeContextMenu();
      };

      const dialog = document.createElement('div');
      dialog.className = 'message-menu-dialog';

      // Copy Option
      const copyBtn = document.createElement('button');
      copyBtn.className = 'message-menu-item';
      copyBtn.innerHTML = '<span>📋</span> Copy';
      copyBtn.onclick = () => {
        const textToCopy = msg.text;
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast('Copied to clipboard!');
        }).catch(() => {
          const textArea = document.createElement('textarea');
          textArea.value = textToCopy;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showToast('Copied to clipboard!');
        });
        closeContextMenu();
      };
      dialog.appendChild(copyBtn);

      // Edit & Delete Options (Only for sender's own messages)
      if (msg.sender === currentUsername && !msg.isDeleted) {
        const editBtn = document.createElement('button');
        editBtn.className = 'message-menu-item';
        editBtn.innerHTML = '<span>✏️</span> Edit';
        editBtn.onclick = () => {
          setEditTarget(msg);
          closeContextMenu();
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'message-menu-item danger';
        deleteBtn.innerHTML = '<span>🗑️</span> Delete';
        deleteBtn.onclick = async () => {
          localMessages = localMessages.filter(m => m.id !== msg.id);
          renderMessages(localMessages);
          saveLocalMessagesToWorker();
          closeContextMenu();
        };

        dialog.appendChild(editBtn);
        dialog.appendChild(deleteBtn);
      }

      backdrop.appendChild(dialog);
      document.body.appendChild(backdrop);
      activeMenu = backdrop;
    }

    function attachHoldAndContextMenuEvents(element, msg) {
      element.oncontextmenu = (e) => openContextMenu(e, msg);

      const startPress = (e) => {
        pressTimer = setTimeout(() => {
          openContextMenu(e, msg);
        }, 500);
      };

      const cancelPress = () => {
        clearTimeout(pressTimer);
      };

      element.ontouchstart = startPress;
      element.ontouchend = cancelPress;
      element.ontouchmove = cancelPress;
      element.onmousedown = startPress;
      element.onmouseup = cancelPress;
      element.onmouseleave = cancelPress;
    }

    async function saveLocalMessagesToWorker() {
      try {
        await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            key: 'messages',
            value: JSON.stringify(localMessages)
          })
        });
      } catch (err) {
        console.error('Error saving messages to worker:', err);
      }
    }

    function appendMessage(msg) {
      const container = document.getElementById('chat-messages');

      if (msg.isSystem) {
        const systemDiv = document.createElement('div');
        systemDiv.className = `system-call-bubble ${msg.isMissed ? 'missed' : ''}`;
        systemDiv.textContent = msg.text;
        container.appendChild(systemDiv);
        return;
      }

      const isSent = msg.sender === currentUsername;

      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isSent ? 'sent' : 'received'}`;
      bubble.dataset.id = msg.id;

      // Header row with sender & reply action
      const headerRow = document.createElement('div');
      headerRow.className = 'message-header-row';

      const senderDiv = document.createElement('div');
      senderDiv.className = 'message-sender';
      senderDiv.textContent = msg.sender || 'Anonymous';

      const replyBtn = document.createElement('button');
      replyBtn.type = 'button';
      replyBtn.className = 'reply-btn';
      replyBtn.textContent = 'Reply';
      replyBtn.onclick = () => setReplyTarget(msg);

      headerRow.appendChild(senderDiv);
      headerRow.appendChild(replyBtn);
      bubble.appendChild(headerRow);

      // If this message is a reply to another message
      if (msg.replyTo) {
        const quoteDiv = document.createElement('div');
        quoteDiv.className = 'reply-quote';

        const quoteSender = document.createElement('div');
        quoteSender.className = 'reply-quote-sender';
        quoteSender.textContent = msg.replyTo.sender || 'Anonymous';

        const quoteText = document.createElement('div');
        quoteText.className = 'reply-quote-text';
        let displayQuoteText = msg.replyTo.text || '';
        if (displayQuoteText.includes('data:image/')) {
          const match = displayQuoteText.match(/data:image\/[a-zA-Z]+;base64,[^\n\s]+/);
          if (match) {
            const caption = displayQuoteText.replace(match[0], '').trim();
            displayQuoteText = caption ? `📷 Image: ${caption}` : '📷 Image';
          }
        }
        quoteText.textContent = displayQuoteText;

        quoteDiv.appendChild(quoteSender);
        quoteDiv.appendChild(quoteText);
        bubble.appendChild(quoteDiv);
      }

      const textDiv = document.createElement('div');
      textDiv.className = 'message-text-content';

      if (msg.isDeleted) {
        bubble.classList.add('deleted-bubble');
        textDiv.textContent = 'This message was deleted';
      } else {
        const fullText = msg.text || '';
        const base64Regex = /data:image\/[a-zA-Z]+;base64,[^\n\s]+/;
        const match = fullText.match(base64Regex);

        if (match) {
          const imageSrc = match[0];
          const captionText = fullText.replace(imageSrc, '').trim();

          const imgEl = document.createElement('img');
          imgEl.src = imageSrc;
          imgEl.alt = 'Uploaded Image';
          imgEl.className = 'chat-image-thumbnail';
          imgEl.onclick = (e) => {
            e.stopPropagation();
            openImageModal(imageSrc);
          };
          textDiv.appendChild(imgEl);

          if (captionText) {
            const captionDiv = document.createElement('div');
            captionDiv.textContent = captionText;
            textDiv.appendChild(captionDiv);
          }
        } else {
          textDiv.textContent = fullText;
        }

        if (msg.isEdited) {
          const editedSpan = document.createElement('span');
          editedSpan.className = 'edited-tag';
          editedSpan.textContent = ' (edited)';
          textDiv.appendChild(editedSpan);
        }
      }

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      timeDiv.textContent = timeStr;

      bubble.appendChild(textDiv);
      bubble.appendChild(timeDiv);

      if (!msg.isDeleted) {
        attachHoldAndContextMenuEvents(bubble, msg);
      }

      container.appendChild(bubble);
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const captionText = input.value.trim();

      if (!captionText && !pendingImageBase64) return;

      let combinedText = captionText;
      if (pendingImageBase64) {
        combinedText = captionText ? `${pendingImageBase64}\n${captionText}` : pendingImageBase64;
      }

      if (activeEdit) {
        const msgIdx = localMessages.findIndex(m => m.id === activeEdit.id);
        if (msgIdx !== -1) {
          localMessages[msgIdx].text = combinedText;
          localMessages[msgIdx].isEdited = true;
          localMessages[msgIdx].editedAt = new Date().toISOString();
        }
        input.value = '';
        removeAttachedImage();
        cancelEdit();
        renderMessages(localMessages);
        saveLocalMessagesToWorker();
        return;
      }

      const newMessage = {
        id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
        sender: currentUsername,
        text: combinedText,
        replyTo: activeReply || null,
        timestamp: new Date().toISOString()
      };

      input.value = '';
      removeAttachedImage();
      cancelReply();

      // Optimistic update
      localMessages.push(newMessage);
      renderMessages(localMessages);
      scrollToBottom();

      saveLocalMessagesToWorker();
    }
  </script>
</body>
</html>
