<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <div class="app-container">
    <div id="chat-screen" class="card chat-card">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="user-info">
          <div class="avatar">💬</div>
          <div>
            <h3>Anonymous Chat</h3>
            <span class="status-indicator">
              <span class="status-dot online"></span> Connected
            </span>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="chat-messages" id="chat-messages">
        <!-- Messages appended dynamically -->
      </div>

      <!-- Real-Time Typing Indicator -->
      <div class="typing-container" id="typing-indicator">
        <span id="typing-text">Anonymous is typing...</span>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Chat Input Form -->
      <form id="chat-form" class="chat-input-area" onsubmit="handleSendMessage(event)">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
          oninput="handleTypingInput()"
          onclick="this.focus()"
        >
        <button type="submit" class="btn primary-btn send-btn">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
